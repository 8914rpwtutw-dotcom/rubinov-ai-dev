<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Rubinov AI Assistant</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { margin: 0; font-family: sans-serif; background: #0f0f13; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: #17171f; display: flex; flex-direction: column; padding: 15px; border-right: 1px solid #2a2a38; }
        .main { flex: 1; display: flex; flex-direction: column; justify-content: space-between; background: #111118; }
        .btn { background: #7c3aed; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        .btn:hover { background: #6d28d9; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 70%; padding: 12px 16px; border-radius: 12px; line-height: 1.4; }
        .message.user { background: #7c3aed; align-self: flex-end; }
        .message.bot { background: #22222e; align-self: flex-start; }
        .input-area { padding: 20px; background: #17171f; display: flex; gap: 10px; border-top: 1px solid #2a2a38; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333344; background: #0f0f13; color: #fff; outline: none; }
        .user-panel { margin-top: auto; padding-top: 10px; border-top: 1px solid #2a2a38; font-size: 14px; display: flex; flex-direction: column; gap: 8px; }
        .chat-item { padding: 8px; background: #22222e; border-radius: 6px; cursor: pointer; margin-bottom: 5px; }
        .chat-item:hover { background: #2e2e42; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Rubinov AI</h2>
        <button class="btn" onclick="newChat()">+ Новый диалог</button>
        <div style="flex:1; overflow-y:auto;" id="chat-list">
            <div class="chat-item" onclick="selectChat('default')">Основной чат</div>
        </div>
        <div class="user-panel" id="userPanel">
            <span id="userName">Гость (осталось 10 запросов)</span>
            <div id="g_id_onload"
                 data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse">
            </div>
            <div class="g_id_signin" data-type="standard" data-size="medium"></div>
            <button class="btn" id="logoutBtn" style="display:none; background: #ef4444;" onclick="logout()">Выйти</button>
        </div>
    </div>

    <div class="main">
        <div class="chat-box" id="chatBox"></div>
        <div class="input-area">
            <input type="text" id="promptInput" placeholder="Введите сообщение или 'нарисуй...'..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="btn" onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script>
        let currentSessionId = 'default_' + Date.now();
        let token = localStorage.getItem('token');

        async function checkUser() {
            let headers = token ? {'Authorization': 'Bearer ' + token} : {};
            let res = await fetch('/api/me', {headers});
            let data = await res.json();
            if (data.username) {
                document.getElementById('userName').innerText = "Аккаунт: " + data.username;
                document.getElementById('logoutBtn').style.display = 'block';
            } else {
                document.getElementById('userName').innerText = "Гость (10 бесплатных запросов)";
                document.getElementById('logoutBtn').style.display = 'none';
            }
            loadHistory();
        }

        async function handleCredentialResponse(response) {
            let res = await fetch('/api/google-login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({credential: response.credential})
            });
            let data = await res.json();
            if (res.ok) {
                localStorage.setItem('token', data.access_token);
                token = data.access_token;
                checkUser();
            } else {
                alert(data.detail);
            }
        }

        function logout() {
            localStorage.removeItem('token');
            token = null;
            checkUser();
        }

        function newChat() {
            currentSessionId = 'chat_' + Date.now();
            let list = document.getElementById('chat-list');
            let item = document.createElement('div');
            item.className = 'chat-item';
            item.innerText = 'Чат ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            item.onclick = () => selectChat(currentSessionId);
            list.prepend(item);
            document.getElementById('chatBox').innerHTML = '';
        }

        function selectChat(id) {
            currentSessionId = id;
            loadHistory();
        }

        async function loadHistory() {
            let headers = token ? {'Authorization': 'Bearer ' + token} : {};
            let res = await fetch(`/api/history?session_id=${currentSessionId}`, {headers});
            let data = await res.json();
            let box = document.getElementById('chatBox');
            box.innerHTML = '';
            data.history.forEach(msg => {
                let div = document.createElement('div');
                div.className = 'message ' + (msg.role === 'user' ? 'user' : 'bot');
                div.innerText = msg.content;
                if (msg.image_url) {
                    let img = document.createElement('img');
                    img.src = msg.image_url;
                    img.style.maxWidth = '100%';
                    img.style.borderRadius = '8px';
                    img.style.marginTop = '10px';
                    div.appendChild(img);
                }
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        }

        async function sendMessage() {
            let input = document.getElementById('promptInput');
            let text = input.value.trim();
            if (!text) return;

            let box = document.getElementById('chatBox');
            let userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.innerText = text;
            box.appendChild(userDiv);
            input.value = '';
            box.scrollTop = box.scrollHeight;

            let headers = {'Content-Type': 'application/json'};
            if (token) headers['Authorization'] = 'Bearer ' + token;

            let res = await fetch('/api/chat', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({prompt: text, session_id: currentSessionId})
            });
            let data = await res.json();

            if (res.ok) {
                let botDiv = document.createElement('div');
                botDiv.className = 'message bot';
                botDiv.innerText = data.response;
                if (data.image_url) {
                    let img = document.createElement('img');
                    img.src = data.image_url;
                    img.style.maxWidth = '100%';
                    img.style.borderRadius = '8px';
                    img.style.marginTop = '10px';
                    botDiv.appendChild(img);
                }
                box.appendChild(botDiv);
                box.scrollTop = box.scrollHeight;
            } else {
                alert(data.detail);
            }
        }

        checkUser();
    </script>
</body>
</html>
