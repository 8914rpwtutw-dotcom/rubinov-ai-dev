<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rubinov AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Подключаем Google Identity Services SDK -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
:root {
    --bg-main: #040508;
    --bg-sidebar: rgba(10, 12, 18, 0.72);
    --card-bg: rgba(18, 21, 31, 0.55);
    --border-color: rgba(255,255,255,0.06);
    --accent-gradient: linear-gradient(135deg,#6366f1,#a855f7);
    --accent-glow: rgba(168,85,247,.18);

    --text-main:#f1f5f9;
    --text-muted:#94a3b8;

    --user-bg: linear-gradient(
        135deg,
        rgba(99,102,241,.16),
        rgba(168,85,247,.14)
    );

    --bot-bg:rgba(15,18,26,.72);
}

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html, body {
    width:100%;
    height:100%;
    height:100dvh;
    overflow:hidden;
    background:var(--bg-main);
    color:var(--text-main);
}

body::before {
    content:"";
    position:fixed;
    top:-15vh;
    left:-15vw;
    width:55vw;
    height:55vh;
    background: radial-gradient(circle, rgba(99,102,241,.08), rgba(168,85,247,.025) 60%, transparent 80%);
    filter:blur(80px);
    pointer-events:none;
    animation: glowMove 10s ease-in-out infinite alternate;
}

body::after {
    content:"";
    position:fixed;
    right:-15vw;
    bottom:-15vh;
    width:55vw;
    height:55vh;
    background: radial-gradient(circle, rgba(168,85,247,.07), rgba(236,72,153,.02) 60%, transparent 80%);
    filter:blur(80px);
    pointer-events:none;
    animation: glowMove2 12s ease-in-out infinite alternate;
}

@keyframes glowMove {
    from { transform:translate(0,0); }
    to { transform:translate(5vw,3vh); }
}

@keyframes glowMove2 {
    from { transform:translate(0,0); }
    to { transform:translate(-4vw,-4vh); }
}

::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,.08); border-radius:20px; }
::-webkit-scrollbar-thumb:hover { background:rgba(168,85,247,.35); }

#sidebar {
    width:280px;
    min-width:280px;
    height:100dvh;
    padding:20px 14px;
    background:var(--bg-sidebar);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border-right:1px solid var(--border-color);
    display:flex;
    flex-direction:column;
    z-index:50;
    box-shadow: 15px 0 40px rgba(0,0,0,.4);
    transition: margin-left .35s cubic-bezier(.16,1,.3,1);
}

body.sidebar-collapsed #sidebar {
    margin-left:-280px;
}

.brand {
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:22px;
    padding:0 4px;
}

.brand-logo {
    width:36px;
    height:36px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(135deg, #ff4b4b, #900c3f);
    box-shadow: 0 0 25px rgba(255,75,75,.35);
    animation: logoFloat 4s ease-in-out infinite;
}

.brand-logo::before {
    content:"◆";
    color:white;
    font-size:20px;
    text-shadow: 0 0 15px rgba(255,255,255,.8);
}

@keyframes logoFloat {
    0%,100% { transform:translateY(0); }
    50% { transform:translateY(-3px); }
}

.brand h2 {
    font-size:15px;
    font-weight:700;
    color:white;
}

.brand span {
    display:block;
    margin-top:2px;
    font-size:10px;
    color:var(--text-muted);
}

.btn-new-chat {
    border:0;
    width:100%;
    background: var(--accent-gradient);
    color:white;
    padding:12px 16px;
    border-radius:14px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    margin-bottom:18px;
    box-shadow: 0 4px 20px rgba(99,102,241,.3);
    transition:.25s;
}

.btn-new-chat:hover {
    transform:translateY(-2px);
    box-shadow: 0 8px 28px rgba(168,85,247,.45);
}

.chats-header {
    display:flex;
    justify-content:space-between;
    font-size:10px;
    color:var(--text-muted);
    font-weight:700;
    margin-bottom:8px;
    padding:0 4px;
    text-transform:uppercase;
    letter-spacing:.8px;
}

#chats-list {
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:6px;
}

.chat-item {
    background:rgba(255,255,255,.015);
    border:1px solid var(--border-color);
    border-radius:12px;
    padding:10px 12px;
    font-size:12px;
    color:#cbd5e1;
    cursor:pointer;
    transition:.2s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.chat-item span.chat-title-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
}

.chat-item .delete-chat-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    padding: 2px 5px;
    border-radius: 4px;
    opacity: 0;
    transition: 0.2s;
}

.chat-item:hover .delete-chat-btn {
    opacity: 1;
}

.chat-item .delete-chat-btn:hover {
    color: #f87171;
    background: rgba(239, 68, 68, 0.1);
}

.chat-item:hover, .chat-item.active {
    background:rgba(168,85,247,.1);
    border-color: rgba(168,85,247,.35);
    color:white;
}

.user-profile-section {
    margin-top:auto;
    padding-top:12px;
    border-top: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.user-status-text {
    font-size: 11px;
    color: var(--text-muted);
    word-break: break-all;
}

.logout-btn {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #f87171;
    padding: 6px;
    border-radius: 8px;
    font-size: 11px;
    cursor: pointer;
    display: none;
    text-align: center;
}
.logout-btn:hover { background: rgba(239, 68, 68, 0.25); }

.sidebar-footer {
    display:flex;
    align-items:center;
    gap:8px;
    padding-top:10px;
    font-size:11px;
    color:var(--text-muted);
}

.status-dot {
    width:7px;
    height:7px;
    border-radius:50%;
    background:#a855f7;
    box-shadow: 0 0 10px rgba(168,85,247,.8);
}

#main {
    flex:1;
    min-width:0;
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--bg-main);
    position:relative;
}

#chat-header {
    height:60px;
    min-height:60px;
    border-bottom: 1px solid var(--border-color);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    background: rgba(4,5,8,.52);
    backdrop-filter:blur(16px);
    z-index:10;
}

.header-left {
    display:flex;
    align-items:center;
    gap:14px;
}

.menu-toggle {
    background: rgba(255,255,255,.025);
    border: 1px solid var(--border-color);
    color:white;
    border-radius:12px;
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

#chat-header h3 {
    font-size:14px;
    font-weight:600;
    color:white;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 600px;
}

#chat-container {
    flex:1;
    overflow-y:auto;
    padding: 24px 24px 150px 24px;
    display:flex;
    flex-direction:column;
    gap:22px;
    max-width:900px;
    width:100%;
    margin:0 auto;
}

.welcome-screen {
    margin:auto;
    text-align:center;
    width:90%;
    max-width:480px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:15px;
}

.welcome-avatar {
    width:80px;
    height:80px;
    border-radius:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(168,85,247,.05);
    border: 1px solid rgba(168,85,247,.18);
    box-shadow: 0 0 50px rgba(168,85,247,.12);
}

.welcome-avatar span {
    font-size:34px;
    color:#ff5252;
}

.welcome-screen h1 { font-size:24px; font-weight:700; color:white; }
.welcome-screen p { font-size:13.5px; line-height:1.6; color:var(--text-muted); }

.msg-row { display:flex; flex-direction:column; width:100%; }
.user-row { align-items:flex-end; }
.bot-row { align-items:flex-start; }

.msg-user {
    max-width:85%;
    padding:13px 18px;
    border-radius: 18px 18px 4px 18px;
    background:var(--user-bg);
    border: 1px solid rgba(168,85,247,.22);
    color:white;
    font-size:13.5px;
    line-height:1.55;
    word-break: break-word;
}

.msg-bot {
    max-width:90%;
    padding:18px 22px;
    border-radius: 18px 18px 18px 4px;
    background:var(--bot-bg);
    border: 1px solid var(--border-color);
    color:#e2e8f0;
    font-size:13.5px;
    line-height:1.65;
    word-break: break-word;
}

.loader-box {
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--bot-bg);
    border: 1px solid var(--border-color);
    border-radius: 18px 18px 18px 4px;
    padding:14px 20px;
    color:var(--text-muted);
}

.spinner {
    width:16px;
    height:16px;
    border: 2px solid rgba(168,85,247,.2);
    border-top-color:#a855f7;
    border-radius:50%;
    animation: spin .8s linear infinite;
}

@keyframes spin { to { transform:rotate(360deg); } }

#input-wrapper {
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    padding: 16px 24px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(4,5,8,0), rgba(4,5,8,.85) 40%, #040508 100%);
    z-index:20;
}

#input-container {
    max-width:900px;
    margin:0 auto;
    background: rgba(13,16,24,.82);
    backdrop-filter:blur(24px);
    border: 1px solid rgba(168,85,247,.18);
    border-radius:20px;
    padding:8px 12px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.input-row { display:flex; gap:8px; align-items:center; width:100%; }

.mini-btn {
    width:40px;
    height:40px;
    background: rgba(255,255,255,.025);
    border: 1px solid var(--border-color);
    color:var(--text-muted);
    border-radius:12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.mini-btn:hover { color:white; background: rgba(168,85,247,.12); }

#prompt-input {
    flex:1;
    min-width:0;
    background:transparent;
    border:0;
    outline:none;
    padding:6px 4px;
    color:white;
    font-size:14px;
}
#prompt-input::placeholder { color:var(--text-muted); }

.btn-action {
    min-width:100px;
    border:0;
    border-radius:12px;
    padding:11px 20px;
    background: var(--accent-gradient);
    color:white;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    flex-shrink:0;
}

#file-info-bar {
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background: rgba(168,85,247,.12);
    border: 1px solid rgba(168,85,247,.25);
    padding: 7px 11px;
    border-radius:10px;
    color:#d8b4fe;
    font-size:11.5px;
}
#file-info-bar button { background:none; border:0; color:#f87171; cursor:pointer; font-size:14px; }

#sidebar-overlay {
    display:none;
    position:fixed;
    inset:0;
    background: rgba(4,5,8,.7);
    backdrop-filter:blur(6px);
    z-index:40;
}
#sidebar-overlay.active { display:block; }

@media(max-width:768px) {
    #sidebar {
        position:fixed;
        top:0;
        left:0;
        transform: translateX(-100%);
        margin-left:0 !important;
        transition: transform .35s cubic-bezier(.16,1,.3,1);
    }
    #sidebar.mobile-open { transform: translateX(0); }
}
</style>
</head>

<body>

<div id="sidebar-overlay"></div>

<aside id="sidebar">
    <div class="brand">
        <div class="brand-logo"></div>
        <div>
            <h2>Rubinov AI</h2>
            <span>Assistant</span>
        </div>
    </div>

    <button class="btn-new-chat" onclick="newChat()">
        <span>＋</span> Новый диалог
    </button>

    <div class="chats-header">
        <span>Чаты</span>
    </div>

    <div id="chats-list">
        <!-- Сгенерированные чаты будут здесь -->
    </div>

    <div class="user-profile-section">
        <div class="user-status-text" id="userStatus">Проверка статуса...</div>
        
        <!-- Встроен ваш реальный Google Client ID -->
        <div id="g_id_onload"
             data-client_id="456399427995-vm7t0rmj7ar701lhj3v5i72pgjcm1tep.apps.googleusercontent.com"
             data-callback="handleGoogleLogin"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin" data-type="standard" data-size="medium" data-shape="rectangular" data-theme="filled_black"></div>

        <button class="logout-btn" id="logoutBtn" onclick="logout()">Выйти из аккаунта</button>
    </div>

    <div class="sidebar-footer">
        <span class="status-dot"></span>
        <span>Online</span>
    </div>
</aside>

<main id="main">
    <header id="chat-header">
        <div class="header-left">
            <button class="menu-toggle" id="menu-toggle">☰</button>
            <h3 id="currentChatTitle">Основной чат</h3>
        </div>
    </header>

    <section id="chat-container">
        <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-avatar"><span>◆</span></div>
            <h1>Rubinov AI</h1>
            <p>Чем я могу помочь вам сегодня?</p>
        </div>
    </section>

    <div id="input-wrapper">
        <div id="input-container">
            <div id="file-info-bar">
                <span id="file-name">📷 Файл прикреплён</span>
                <button id="remove-file">✕</button>
            </div>

            <div class="input-row">
                <input type="file" id="file-input" accept="image/*" hidden>
                <button class="mini-btn" id="photo-btn" title="Прикрепить фото">📷</button>
                <button class="mini-btn" id="image-btn" title="Сгенерировать изображение">✦</button>
                <input type="text" id="prompt-input" placeholder="Введите сообщение или опишите картинку...">
                <button class="btn-action" id="send-btn">Отправить</button>
            </div>
        </div>
    </div>
</main>

<script>
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("sidebar-overlay");
const menu = document.getElementById("menu-toggle");
const input = document.getElementById("prompt-input");
const send = document.getElementById("send-btn");
const chat = document.getElementById("chat-container");
const fileInput = document.getElementById("file-input");
const photoButton = document.getElementById("photo-btn");
const imageButton = document.getElementById("image-btn");
const fileBar = document.getElementById("file-info-bar");
const fileName = document.getElementById("file-name");
const removeFile = document.getElementById("remove-file");

let currentSessionId = 'chat_' + Date.now();
let token = localStorage.getItem('token');
let chatTitles = JSON.parse(localStorage.getItem('chatTitles') || '{}');
let chatSessions = JSON.parse(localStorage.getItem('chatSessions') || '["' + currentSessionId + '"]');

menu.addEventListener("click", () => {
    if (window.innerWidth <= 768) {
        sidebar.classList.toggle("mobile-open");
        overlay.classList.toggle("active");
    } else {
        document.body.classList.toggle("sidebar-collapsed");
    }
});

overlay.addEventListener("click", () => {
    sidebar.classList.remove("mobile-open");
    overlay.classList.remove("active");
});

photoButton.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => {
    if (!fileInput.files.length) return;
    fileName.textContent = "📷 " + fileInput.files[0].name;
    fileBar.style.display = "flex";
});
removeFile.addEventListener("click", () => {
    fileInput.value = "";
    fileBar.style.display = "none";
});
imageButton.addEventListener("click", () => {
    input.value = "Нарисуй: ";
    input.focus();
});

// Генерация названия строго из первых 4 слов
function generateShortTitle(text) {
    const words = text.replace(/[#_*`"'.,!?]/g, '').trim().split(/\s+/);
    const selected = words.slice(0, 4).join(' ');
    return selected ? selected : "Новый диалог";
}

async function checkUser() {
    let headers = token ? {'Authorization': 'Bearer ' + token} : {};
    try {
        let res = await fetch('/api/me', {headers});
        let data = await res.json();
        let statusEl = document.getElementById('userStatus');
        let logoutBtn = document.getElementById('logoutBtn');
        let googleBtn = document.querySelector('.g_id_signin');

        if (data.username) {
            statusEl.innerHTML = `Аккаунт: <b>${data.username}</b> (Безлимит)`;
            logoutBtn.style.display = 'block';
            if (googleBtn) googleBtn.style.display = 'none';
        } else {
            statusEl.innerHTML = `Режим гостя (осталось 10 запросов)`;
            logoutBtn.style.display = 'none';
            if (googleBtn) googleBtn.style.display = 'block';
        }
    } catch (e) {
        console.error(e);
    }
    renderChatList();
    loadHistory();
}

async function handleGoogleLogin(response) {
    let res = await fetch('/api/google-login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({credential: response.credential})
    });
    let data = await res.json();
    if (res.ok) {
        localStorage.setItem('token', data.access_token);
        token = data.access_token;
        checkUser();
    } else {
        alert(data.detail || "Ошибка входа через Google");
    }
}

function logout() {
    localStorage.removeItem('token');
    token = null;
    checkUser();
    location.reload();
}

function newChat() {
    currentSessionId = 'chat_' + Date.now();
    if (!chatSessions.includes(currentSessionId)) {
        chatSessions.unshift(currentSessionId);
        localStorage.setItem('chatSessions', JSON.stringify(chatSessions));
    }
    
    renderChatList();
    loadHistory();
}

function selectChat(id) {
    currentSessionId = id;
    renderChatList();
    loadHistory();
    if (window.innerWidth <= 768) {
        sidebar.classList.remove("mobile-open");
        overlay.classList.remove("active");
    }
}

function deleteChat(id, event) {
    event.stopPropagation();
    
    chatSessions = chatSessions.filter(s => s !== id);
    localStorage.setItem('chatSessions', JSON.stringify(chatSessions));
    delete chatTitles[id];
    localStorage.setItem('chatTitles', JSON.stringify(chatTitles));

    if (chatSessions.length === 0) {
        newChat();
    } else if (currentSessionId === id) {
        selectChat(chatSessions[0]);
    } else {
        renderChatList();
    }
}

function renderChatList() {
    let list = document.getElementById('chats-list');
    list.innerHTML = '';

    if (chatSessions.length === 0) {
        newChat();
        return;
    }

    chatSessions.forEach(id => {
        let item = document.createElement('div');
        item.className = 'chat-item ' + (id === currentSessionId ? 'active' : '');
        
        let titleText = chatTitles[id] || "Новый диалог";
        
        item.innerHTML = `
            <span class="chat-title-text">${escapeHtml(titleText)}</span>
            <button class="delete-chat-btn" title="Удалить чат" onclick="deleteChat('${id}', event)">✕</button>
        `;
        item.onclick = () => selectChat(id);
        list.appendChild(item);
    });

    let currentTitle = chatTitles[currentSessionId] || "Основной чат";
    document.getElementById('currentChatTitle').innerText = currentTitle;
}

async function loadHistory() {
    let headers = token ? {'Authorization': 'Bearer ' + token} : {};
    try {
        let res = await fetch(`/api/history?session_id=${currentSessionId}`, {headers});
        let data = await res.json();
        
        chat.innerHTML = '';
        
        if (data.history && data.history.length > 0) {
            data.history.forEach(msg => {
                let row = document.createElement('div');
                row.className = 'msg-row ' + (msg.role === 'user' ? 'user-row' : 'bot-row');
                
                let bubble = document.createElement('div');
                bubble.className = msg.role === 'user' ? 'msg-user' : 'msg-bot';
                bubble.innerText = msg.content;
                
                if (msg.image_url) {
                    let img = document.createElement('img');
                    img.src = msg.image_url;
                    img.style.maxWidth = '100%';
                    img.style.borderRadius = '12px';
                    img.style.marginTop = '10px';
                    bubble.appendChild(img);
                }
                row.appendChild(bubble);
                chat.appendChild(row);
            });
        } else {
            chat.innerHTML = `
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-avatar"><span>◆</span></div>
                    <h1>Rubinov AI</h1>
                    <p>Чем я могу помочь вам сегодня?</p>
                </div>
            `;
        }
        scrollBottom();
    } catch(e) {
        console.error("Ошибка загрузки истории:", e);
    }
}

async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    // Автоматическое создание названия из первых 4 слов
    if (!chatTitles[currentSessionId]) {
        chatTitles[currentSessionId] = generateShortTitle(text);
        localStorage.setItem('chatTitles', JSON.stringify(chatTitles));
        renderChatList();
    }

    let welcome = document.getElementById('welcomeScreen');
    if (welcome) welcome.remove();

    const userRow = document.createElement("div");
    userRow.className = "msg-row user-row";
    userRow.innerHTML = `<div class="msg-user">${escapeHtml(text)}</div>`;
    chat.appendChild(userRow);

    const loader = document.createElement("div");
    loader.className = "msg-row bot-row";
    loader.innerHTML = `
        <div class="loader-box">
            <div class="spinner"></div>
            <span>Думаю...</span>
        </div>
    `;
    chat.appendChild(loader);
    input.value = "";
    scrollBottom();

    let headers = {'Content-Type': 'application/json'};
    if (token) headers['Authorization'] = 'Bearer ' + token;

    try {
        let res = await fetch('/api/chat', {
            method: 'POST',
            headers: headers,
            body: JSON.stringify({prompt: text, session_id: currentSessionId})
        });
        let data = await res.json();
        loader.remove();

        if (res.ok) {
            const botRow = document.createElement("div");
            botRow.className = "msg-row bot-row";
            
            let botBubble = document.createElement('div');
            botBubble.className = "msg-bot";
            botBubble.innerText = data.response;

            if (data.image_url) {
                let img = document.createElement('img');
                img.src = data.image_url;
                img.style.maxWidth = '100%';
                img.style.borderRadius = '12px';
                img.style.marginTop = '10px';
                botBubble.appendChild(img);
            }

            botRow.appendChild(botBubble);
            chat.appendChild(botRow);
        } else {
            const errRow = document.createElement("div");
            errRow.className = "msg-row bot-row";
            errRow.innerHTML = `<div class="msg-bot" style="color: #f87171;">⚠️ ${data.detail || "Произошла ошибка"}</div>`;
            chat.appendChild(errRow);
        }
    } catch (err) {
        loader.remove();
        alert("Ошибка соединения с сервером");
    }

    scrollBottom();
}

input.addEventListener("keydown", event => {
    if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
    }
});

send.addEventListener("click", sendMessage);

function escapeHtml(text) {
    return text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function scrollBottom() {
    chat.scrollTo({ top: chat.scrollHeight, behavior: "smooth" });
}

checkUser();
</script>

</body>
</html>
