<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rubinov AI</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #0b0c10; color: #e0e0e0; display: flex; height: 100vh; overflow: hidden; }

    /* Боковая панель */
    .sidebar { width: 260px; background-color: #12131c; border-right: 1px solid #1f202e; display: flex; flex-direction: column; padding: 16px; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: bold; color: #fff; margin-bottom: 20px; }
    .brand-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #a855f7, #6366f1); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; }
    
    .btn-new-chat { background: linear-gradient(90deg, #7c3aed, #4f46e5); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; width: 100%; justify-content: center; margin-bottom: 20px; transition: 0.2s; }
    .btn-new-chat:hover { opacity: 0.9; }

    .chat-list-title { font-size: 12px; color: #6b7280; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .chat-history { flex: 1; overflow-y: auto; }
    .chat-item { padding: 10px 12px; border-radius: 8px; background: #1a1b26; margin-bottom: 6px; font-size: 14px; cursor: pointer; color: #d1d5db; display: flex; align-items: center; justify-content: space-between; }
    .chat-item.active { background: #252638; border-left: 3px solid #7c3aed; }

    .user-footer { border-top: 1px solid #1f202e; padding-top: 12px; display: flex; align-items: center; justify-content: space-between; }
    .user-info { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #9ca3af; }
    .status-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; }

    /* Основная область */
    .main-chat { flex: 1; display: flex; flex-direction: column; background-color: #0b0c10; position: relative; }
    .chat-header { height: 55px; border-bottom: 1px solid #1f202e; display: flex; align-items: center; padding: 0 20px; font-weight: 600; color: #fff; justify-content: space-between; }
    .limit-badge { font-size: 12px; background: #1f202e; padding: 4px 10px; border-radius: 12px; color: #a78bfa; }

    .messages-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    
    /* Состояние по умолчанию */
    .hero-view { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
    .hero-logo { width: 64px; height: 64px; background: linear-gradient(135deg, #a855f7, #4f46e5); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #fff; margin-bottom: 16px; box-shadow: 0 0 30px rgba(124, 58, 237, 0.3); }

    .message { max-width: 70%; padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.5; }
    .message.user { align-self: flex-end; background: #2e284a; color: #fff; border-bottom-right-radius: 2px; }
    .message.assistant { align-self: flex-start; background: #161722; color: #d1d5db; border: 1px solid #232536; border-bottom-left-radius: 2px; }
    .cancel-hint { font-size: 11px; color: #6b7280; margin-top: 4px; display: block; }

    /* Инпут ввода */
    .input-wrapper { padding: 16px 20px; border-top: 1px solid #1f202e; background: #0b0c10; }
    .input-box { background: #141520; border: 1px solid #27293d; border-radius: 12px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; }
    .input-box input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 14px; }
    .action-btn { background: transparent; border: none; color: #6b7280; cursor: pointer; font-size: 16px; padding: 6px; border-radius: 6px; transition: 0.2s; }
    .action-btn:hover { color: #a78bfa; background: #1e2030; }
    .btn-send { background: #7c3aed; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-send:hover { background: #6d28d9; }

    /* Модалка Google Авторизации */
    .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
    .modal { background: #161722; border: 1px solid #2a2c40; padding: 24px; border-radius: 16px; text-align: center; max-width: 360px; width: 90%; }
    .modal h3 { color: #fff; margin-bottom: 8px; }
    .modal p { font-size: 13px; color: #9ca3af; margin-bottom: 20px; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div>
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-gem"></i></div>
        <span>Rubinov AI</span>
      </div>
      <button class="btn-new-chat" onclick="resetChat()">
        <i class="fa-solid fa-plus"></i> Новый диалог
      </button>
      <div class="chat-list-title">Чаты (1/5)</div>
      <div class="chat-history">
        <div class="chat-item active">
          <span><i class="fa-regular fa-message"></i>Привет!</span>
        </div>
      </div>
    </div>
    <div class="user-footer">
      <div class="user-info">
        <div class="status-dot"></div>
        <span id="user-status-text">Гость</span>
      </div>
      <button id="auth-btn-trigger" class="action-btn" onclick="openAuthModal()"><i class="fa-solid fa-right-to-bracket"></i></button>
    </div>
  </div>

  <!-- Main Chat -->
  <div class="main-chat">
    <div class="chat-header">
      <span id="chat-title">Привет!</span>
      <span class="limit-badge" id="limit-badge">Осталось бесплатных: 10</span>
    </div>

    <div class="messages-container" id="messages-container">
      <!-- Hero View -->
      <div class="hero-view" id="hero-view">
        <div class="hero-logo"><i class="fa-solid fa-gem"></i></div>
        <h2 style="color: #fff; margin-bottom: 8px;">Rubinov AI</h2>
        <p style="color: #6b7280; font-size: 14px;">Чем я могу помочь вам сегодня?</p>
      </div>
    </div>

    <!-- Input Box -->
    <div class="input-wrapper">
      <div class="input-box">
        <button class="action-btn" title="Загрузить файл"><i class="fa-solid fa-paperclip"></i></button>
        <button class="action-btn" title="Сгенерировать картинку"><i class="fa-regular fa-image"></i></button>
        <input type="text" id="user-input" placeholder="Введите сообщение или опишите картинку..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="btn-send" onclick="sendMessage()">Отправить</button>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="auth-modal">
      <div class="modal">
        <i class="fa-solid fa-lock" style="font-size: 32px; color: #a78bfa; margin-bottom: 12px;"></i>
        <h3>Лимит запросов исчерпан</h3>
        <p>Вы использовали 10 бесплатных запросов. Войдите в аккаунт, чтобы продолжить работу с ИИ без ограничений.</p>
        <div id="g_id_onload"
             data-client_id="456399427995-vm7t0rmj7ar701lhj3v5i72pgjcm1tep.apps.googleusercontent.com"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard" data-theme="filled_blue" data-size="large"></div>
        <button onclick="closeAuthModal()" style="margin-top: 12px; background: transparent; border: none; color: #6b7280; cursor: pointer; font-size: 12px;">Закрыть</button>
      </div>
    </div>
  </div>

  <script>
    const MAX_FREE = 10;
    
    function getFreeCount() {
      return parseInt(localStorage.getItem('rubinov_guest_count') || '0', 10);
    }

    function updateLimitUI() {
      const token = localStorage.getItem('auth_token');
      const badge = document.getElementById('limit-badge');
      const userStatus = document.getElementById('user-status-text');

      if (token) {
        badge.innerText = "Безлимитный доступ";
        badge.style.color = "#10b981";
        userStatus.innerText = "Авторизован";
      } else {
        const left = Math.max(0, MAX_FREE - getFreeCount());
        badge.innerText = `Осталось бесплатных: ${left}`;
        badge.style.color = left === 0 ? "#ef4444" : "#a78bfa";
        userStatus.innerText = "Гость";
      }
    }

    function openAuthModal() { document.getElementById('auth-modal').style.display = 'flex'; }
    function closeAuthModal() { document.getElementById('auth-modal').style.display = 'none'; }

    function handleCredentialResponse(response) {
      localStorage.setItem('auth_token', response.credential);
      closeAuthModal();
      updateLimitUI();
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      const token = localStorage.getItem('auth_token');
      const count = getFreeCount();

      if (!token && count >= MAX_FREE) {
        openAuthModal();
        return;
      }

      // Скрыть hero view при первом сообщении
      const hero = document.getElementById('hero-view');
      if (hero) hero.style.display = 'none';

      // Добавить сообщение пользователя
      const container = document.getElementById('messages-container');
      container.innerHTML += `<div class="message user">${text}</div>`;
      input.value = '';

      // Увеличение счетчика для гостя
      if (!token) {
        localStorage.setItem('rubinov_guest_count', count + 1);
        updateLimitUI();
      }

      // Блокировка вызова / индикатор загрузки
      const loadingId = 'load-' + Date.now();
      container.innerHTML += `
        <div class="message assistant" id="${loadingId}">
          Думаю...
          <span class="cancel-hint">сообщение отменено (кликните для отмены)</span>
        </div>`;
      container.scrollTop = container.scrollHeight;

      try {
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;

        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: headers,
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        
        document.getElementById(loadingId).outerHTML = `<div class="message assistant">${data.reply}</div>`;
      } catch (err) {
        document.getElementById(loadingId).outerHTML = `<div class="message assistant" style="color:#ef4444;">Ошибка отправки запроса.</div>`;
      }
      container.scrollTop = container.scrollHeight;
    }

    function resetChat() {
      document.getElementById('messages-container').innerHTML = `
        <div class="hero-view" id="hero-view">
          <div class="hero-logo"><i class="fa-solid fa-gem"></i></div>
          <h2 style="color: #fff; margin-bottom: 8px;">Rubinov AI</h2>
          <p style="color: #6b7280; font-size: 14px;">Чем я могу помочь вам сегодня?</p>
        </div>`;
    }

    // Инициализация
    updateLimitUI();
  </script>
</body>
</html>
